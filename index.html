<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="A responsive JavaScript occupancy tracking app with local storage."
    >
    <title>Occupancy Tracker | JavaScript</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <section class="card" aria-labelledby="app-title">
            <header class="app-header">
                <div>
                    <h1 id="app-title">Occupancy Tracker</h1>
                    <p class="subtitle">
                        Track occupancy counts and save previous entries directly in your browser.
                    </p>
                </div>

                <span class="status-badge" aria-label="Tracker is active">
                    <span class="status-dot" aria-hidden="true"></span>
                    Active
                </span>
            </header>

            <section class="counter-panel" aria-labelledby="current-count-label">
                <p id="current-count-label" class="counter-label">Current occupancy</p>
                <output id="count-el" class="count-display" aria-live="polite">0</output>
                <p id="status-message" class="status-message" aria-live="polite">
                    Ready to start tracking.
                </p>
            </section>

            <div class="button-group" aria-label="Occupancy controls">
                <button id="increment-btn" class="btn btn-primary" type="button">
                    <span aria-hidden="true">+</span>
                    Add person
                </button>

                <div class="secondary-actions">
                    <button id="decrement-btn" class="btn btn-secondary" type="button">
                        <span aria-hidden="true">−</span>
                        Remove
                    </button>
                    <button id="save-btn" class="btn btn-success" type="button" disabled>
                        Save entry
                    </button>
                </div>

                <button id="reset-btn" class="btn btn-danger" type="button">
                    Reset tracker
                </button>
            </div>

            <section class="log-container" aria-labelledby="history-title">
                <div class="log-header">
                    <div>
                        <p class="eyebrow">History</p>
                        <h2 id="history-title">Previous entries</h2>
                    </div>
                    <span id="entry-count" class="entry-count">0 entries</span>
                </div>

                <ul id="save-el" class="entry-list" aria-live="polite">
                    <li class="empty-state">No entries saved yet.</li>
                </ul>

                <p class="storage-note">
                    Saved locally in your browser using localStorage.
                </p>
            </section>
        </section>
    </main>
</body>
</html>
